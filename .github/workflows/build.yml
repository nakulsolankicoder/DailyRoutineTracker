
name: Build Daily Routine APK

on:
  workflow_dispatch:
  push:
    paths:
      - DailyRoutineAndroid_Project.zip
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip DailyRoutineAndroid_Project.zip -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("extracted/DailyRoutineAndroid/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "    defaultConfig {",
              """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {""",
              1
          )
          p.write_text(s)
          PY
          
      - name: Build APK
        working-directory: extracted/DailyRoutineAndroid
        run: gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DailyRoutineTracker-APK
          path: extracted/DailyRoutineAndroid/app/build/outputs/apk/debug/app-debug.apk
          
